name: Deploy Edge Functions

# Runs after an approved PR merges to main (C40CS-15)
on:
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "api/src/utils/skills.ts"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running one
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF as repository secrets. See docs/deployment.md."
            exit 1
          fi

      - name: Build version
        id: version
        run: echo "value=build-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify Resume function health
        shell: bash
        run: |
          HEALTH_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/resume/health"

          echo "Checking deployed Resume function health..."

          for attempt in 1 2 3 4 5; do
            echo "Health check attempt ${attempt}/5"

            RESPONSE_FILE="$(mktemp)"

            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --output "$RESPONSE_FILE" \
              "$HEALTH_URL"; then

              echo "Health endpoint responded successfully."

              if grep -q '"status":"ok"' "$RESPONSE_FILE" && \
                 grep -q '"service":"resume"' "$RESPONSE_FILE"; then
                echo "Resume function health verification passed."
                rm -f "$RESPONSE_FILE"
                exit 0
              fi

              echo "Health endpoint returned an unexpected response."
              cat "$RESPONSE_FILE"
            else
              echo "Health endpoint was not reachable."
            fi

            rm -f "$RESPONSE_FILE"

            if [ "$attempt" -lt 5 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "::error::Deployed Resume function failed health verification."
          exit 1

      - name: List deployed functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Summary
        run: |
          {
            echo "## Edge Functions deployed"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Resume health check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
