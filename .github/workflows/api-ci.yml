name: API CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "api/**"
      - "supabase/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (format, lint, build, tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      # Runs Vitest, then the node:test files. Needs no secrets: the database
      # is mocked. Live-Supabase tests are excluded (see `test:integration`).
      - name: Tests
        run: npm test

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # API modules that Edge Functions import must work under Deno. Add new
      # shared modules to this list.
      - name: Check shared modules under Deno
        run: deno check api/src/utils/skills.ts

      - name: Detect Edge Functions
        id: detect
        run: |
          if ls supabase/functions/*/index.ts > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Edge Functions yet; skipping function checks."
          fi

      - name: Format
        if: steps.detect.outputs.found == 'true'
        run: deno fmt --check supabase/functions

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: deno lint supabase/functions

      - name: Type check
        if: steps.detect.outputs.found == 'true'
        run: deno check supabase/functions/*/index.ts
