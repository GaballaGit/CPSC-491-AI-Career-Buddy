name: API CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: format 
        run: npm run format && git diff --exit-code 

      - name: Build
        run: npm run build
