name: Frontend CI

on:
  push:
    paths:
      - "site/career-buddy-site/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "site/career-buddy-site/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site/career-buddy-site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/career-buddy-site/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
